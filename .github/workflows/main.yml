name: Build Lite (x64)

# 只在推送 v* 标签或手动触发时构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  x64_lite_build:
    # 两个镜像并行尝试：windows-latest 上 vswhere 报称有 ATLMFC 但库文件实际缺失，
    # 所以这里不信任组件登记，直接检查 atlmfc\lib\x64 是否存在，缺了就现场安装。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Resolve toolset and make sure MFC libraries really exist
      shell: pwsh
      run: |
        function Esc([string]$s) { return $s.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A') }
        function Test-Mfc([string]$install) {
          $tools = Join-Path $install 'VC\Tools\MSVC'
          if (-not (Test-Path $tools)) { return $false }
          foreach ($d in Get-ChildItem $tools -Directory -ErrorAction SilentlyContinue) {
            if (Test-Path (Join-Path $d.FullName 'atlmfc\lib\x64')) { return $true }
          }
          return $false
        }

        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $installs = @(& $vswhere -products * -property installationPath) | Where-Object { $_ }
        Write-Host ("::notice title=镜像::" + (Esc "$env:RUNNER_OS / $env:ImageOS"))
        Write-Host ("::notice title=VS 安装列表::" + (Esc ($installs -join ' | ')))

        $chosen = $null
        foreach ($p in $installs) {
          $has = Test-Mfc $p
          Write-Host ("::notice title=VS 安装::" + (Esc "$p  真实存在MFC库=$has"))
          if ($has -and -not $chosen) { $chosen = $p }
        }

        if (-not $chosen) {
          $chosen = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1)
          Write-Host ("::notice title=需要安装 MFC::" + (Esc "$chosen"))
          $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          Write-Host ("::notice title=安装器::" + (Esc "setup.exe 存在=$(Test-Path $setup)"))
          if (Test-Path $setup) {
            & $setup modify --installPath "$chosen" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart
            Write-Host ("::notice title=安装器返回::" + (Esc "exit=$LASTEXITCODE，开始等待库文件出现"))
            $deadline = (Get-Date).AddMinutes(12)
            while ((Get-Date) -lt $deadline -and -not (Test-Mfc $chosen)) { Start-Sleep -Seconds 20 }
          }
          $ok = Test-Mfc $chosen
          Write-Host ("::notice title=MFC 安装结果::" + (Esc "install=$chosen 现在有MFC库=$ok"))
          if (-not $ok) { Write-Host ("::error title=MFC 仍然缺失::" + (Esc "$chosen")); exit 1 }
        }

        $msbuild = Join-Path $chosen 'MSBuild\Current\Bin\MSBuild.exe'
        Write-Host ("::notice title=选定 msbuild::" + (Esc $msbuild))
        $ver = ((& $msbuild -version -nologo) -join ' ')
        Write-Host ("::notice title=msbuild 版本::" + (Esc "$ver"))
        "MSBUILD_PATH=$msbuild" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - name: Run msbuild
      shell: pwsh
      run: |
        $msbuild = $env:MSBUILD_PATH
        $log = 'build.log'
        $outDir = Join-Path $env:GITHUB_WORKSPACE 'Bin\x64\Release (lite)\'

        "=== 策略 1: 解决方案 + Release (lite)|x64，只构建 TrafficMonitor ===" | Out-File -Encoding utf8 $log
        & $msbuild TrafficMonitor.sln -t:TrafficMonitor '-p:configuration=Release (lite)' -p:platform=x64 -p:platformToolset=v143 -nologo -verbosity:normal 2>&1 |
          Tee-Object -FilePath $log -Append
        $code = $LASTEXITCODE
        "策略 1 退出码 = $code" | Out-File -Append -Encoding utf8 $log

        if ($code -ne 0) {
          "=== 策略 2: 直接构建主工程 + 显式 OutDir ===" | Out-File -Append -Encoding utf8 $log
          & $msbuild 'TrafficMonitor\TrafficMonitor.vcxproj' '-p:configuration=Release (lite)' -p:platform=x64 -p:platformToolset=v143 `
              "-p:OutDir=$outDir" "-p:SolutionDir=$env:GITHUB_WORKSPACE\" -nologo -verbosity:normal 2>&1 |
            Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          "策略 2 退出码 = $code" | Out-File -Append -Encoding utf8 $log
        }

        if ($code -ne 0) { exit $code }

    - name: Publish build log (only on failure)
      if: failure()
      shell: pwsh
      run: |
        function Esc([string]$s) { return $s.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A') }
        "## msbuild 输出（末尾 200 行）" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        if (Test-Path build.log) {
          Get-Content build.log -Tail 200 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        } else {
          '(build.log 不存在，说明构建步骤未执行到写日志)' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        }
        '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

        if (Test-Path build.log) {
          $errs = Select-String -Path build.log -Pattern 'error [A-Z]+\d+' -ErrorAction SilentlyContinue | Select-Object -First 5
          if ($errs) {
            foreach ($e in $errs) { Write-Host ("::error title=构建错误::" + (Esc $e.Line.Trim())) }
          } else {
            $tail = (Get-Content build.log -Tail 3) -join ' | '
            Write-Host ("::error title=构建失败-无匹配错误行::" + (Esc $tail))
          }
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-x64-lite-${{ matrix.os }}
        if-no-files-found: error
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll
          Bin/x64/Release (lite)/*.pdb
