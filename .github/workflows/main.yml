name: Build Lite (x64)

# 只在推送 v* 标签或手动触发时构建。
# 说明：原工作流在任意 push 时都会用 Release 配置构建标准版（三个平台各跑一遍），
# 这里改为只构建 x64 的 Lite 版，避免产生无关的标准版产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  x64_lite_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run msbuild
      run: msbuild TrafficMonitor.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-x64-lite
        if-no-files-found: error
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll
          Bin/x64/Release (lite)/*.pdb
