name: Build Lite (x64)

# 只在推送 v* 标签或手动触发时构建。
# 说明：原工作流在任意 push 时都会用 Release 配置构建标准版（三个平台各跑一遍），
# 这里改为只构建 x64 的 Lite 版，避免产生无关的标准版产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  x64_lite_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 镜像里同时有 VS 18(2026) 和 VS 2022(17.x)：前者没有安装 MFC 库，直接用会报
    # MSB8041。这里用 vswhere 显式挑选带 VC.ATLMFC 组件的那套 MSBuild。
    # 同时把关键环境信息写成 annotation（annotation 匿名可见，便于离线排查）。
    - name: Resolve msbuild (prefer the install that has MFC)
      shell: pwsh
      run: |
        function Esc([string]$s) { return $s.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A') }
        $diag = [System.Collections.Generic.List[string]]::new()
        $diag.Add('## 构建环境诊断')
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $diag.Add("- vswhere: $vswhere (存在: $(Test-Path $vswhere))")

        $msbuild = $null
        $withMfc = @()
        if (Test-Path $vswhere) {
          $withMfc = @(& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath)
          $diag.Add("- 装有 MFC(ATLMFC) 的 VS 安装: " + $(if ($withMfc.Count) { $withMfc -join ' | ' } else { '(无)' }))
          $msbuild = (& $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1)
          $diag.Add("- 解析出的 msbuild: $msbuild (存在: $(Test-Path $msbuild))")
        }

        if (-not $msbuild -or -not (Test-Path $msbuild)) {
          $cmd = Get-Command msbuild -ErrorAction SilentlyContinue
          $diag.Add("- 回退到 PATH 中的 msbuild: " + $(if ($cmd) { $cmd.Source } else { '(没有找到)' }))
          if ($cmd) { $msbuild = $cmd.Source }
        }

        $ver = ''
        if ($msbuild -and (Test-Path $msbuild)) {
          $ver = ((& $msbuild -version -nologo) -join ' ')
          $diag.Add("- msbuild 版本: $ver")
        }
        $diag.Add("- 解决方案文件存在: $(Test-Path TrafficMonitor.sln)")
        $diag.Add("- 主工程文件存在: $(Test-Path TrafficMonitor\TrafficMonitor.vcxproj)")

        $diag | ForEach-Object { Write-Host $_ }
        $diag | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

        $mfcText = if ($withMfc.Count) { $withMfc -join ' | ' } else { '无' }
        Write-Host ("::notice title=MSBuild 路径::" + (Esc "$msbuild"))
        Write-Host ("::notice title=MSBuild 版本::" + (Esc "$ver"))
        Write-Host ("::notice title=含 MFC 的 VS 安装::" + (Esc "$mfcText"))

        "MSBUILD_PATH=$msbuild" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    # 策略 1 用解决方案（与上游成功的构建方式一致，只构建主工程）；
    # 若失败再用策略 2 直接构建 vcxproj 并显式指定 OutDir。
    - name: Run msbuild
      shell: pwsh
      run: |
        $msbuild = $env:MSBUILD_PATH
        $log = 'build.log'
        $outDir = Join-Path $env:GITHUB_WORKSPACE 'Bin\x64\Release (lite)\'

        "=== 策略 1: 解决方案 + Release (lite)|x64，只构建 TrafficMonitor ===" | Out-File -Encoding utf8 $log
        & $msbuild TrafficMonitor.sln -t:TrafficMonitor '-p:configuration=Release (lite)' -p:platform=x64 -p:platformToolset=v143 -nologo -verbosity:normal 2>&1 |
          Tee-Object -FilePath $log -Append
        $code = $LASTEXITCODE
        "策略 1 退出码 = $code" | Out-File -Append -Encoding utf8 $log

        if ($code -ne 0) {
          "=== 策略 2: 直接构建主工程 + 显式 OutDir ===" | Out-File -Append -Encoding utf8 $log
          & $msbuild 'TrafficMonitor\TrafficMonitor.vcxproj' '-p:configuration=Release (lite)' -p:platform=x64 -p:platformToolset=v143 `
              "-p:OutDir=$outDir" "-p:SolutionDir=$env:GITHUB_WORKSPACE\" -nologo -verbosity:normal 2>&1 |
            Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          "策略 2 退出码 = $code" | Out-File -Append -Encoding utf8 $log
        }

        if ($code -ne 0) { exit $code }

    # annotation 是匿名可见的，把关键报错行发成 annotation，便于在不登录的情况下定位问题。
    - name: Publish build log (only on failure)
      if: failure()
      shell: pwsh
      run: |
        function Esc([string]$s) { return $s.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A') }
        "## msbuild 输出（末尾 200 行）" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        if (Test-Path build.log) {
          Get-Content build.log -Tail 200 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        } else {
          '(build.log 不存在，说明构建步骤未执行到写日志)' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        }
        '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

        if (Test-Path build.log) {
          $errs = Select-String -Path build.log -Pattern 'error [A-Z]+\d+' -ErrorAction SilentlyContinue | Select-Object -First 5
          if ($errs) {
            foreach ($e in $errs) { Write-Host ("::error title=构建错误::" + (Esc $e.Line.Trim())) }
          } else {
            $tail = (Get-Content build.log -Tail 3) -join ' | '
            Write-Host ("::error title=构建失败-无匹配错误行::" + (Esc $tail))
          }
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-x64-lite
        if-no-files-found: error
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll
          Bin/x64/Release (lite)/*.pdb
